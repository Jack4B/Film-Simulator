name: Release APK

on:
  push:
    branches: [ ui-redesign ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gradle-setup
      # v1: debug-signed APK (installs directly on any phone). A Play-Store
      # signed release can be added later with a keystore in repo secrets.
      - run: ./gradlew :androidApp:assembleDebug
      - name: Rename APK
        run: cp androidApp/build/outputs/apk/debug/*.apk FilmSimulator-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FilmSimulator-apk
          path: FilmSimulator-*.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Film Simulator v1.0.${{ github.run_number }}
          files: FilmSimulator-*.apk
          generate_release_notes: true
